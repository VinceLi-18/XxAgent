- id: backend
  name: './backend.ts'
- id: agent
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    agents: []
    workspaceContext: false
    includeRuntimeContext: false
    includeHarnessIdentity: false
    skills:
      enabled: false
    toolBash: false
    toolJobs: false
    goals: false
- id: skill
  name: '@deepseek-ai/dsh-skill'
- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'
- id: llm
  name: './mock-llm.ts'
- id: persistence
  name: '@xagent/dsh-session-persistence-api'
  config:
    backendOrigin: 'http://xagent.snapshot'
    serviceToken: snapshot-service-token
- id: retrieval
  name: '@xagent/dsh-retrieval'
  config:
    backendOrigin: 'http://xagent.snapshot'
    serviceToken: snapshot-service-token
    delegationPrivateKey: !!js process.env.XAGENT_SNAPSHOT_PRIVATE_KEY
    delegationIssuer: xagent-host
    delegationAudience: xagent-api
- id: tool-retrieval
  name: '@xagent/dsh-tool-retrieval'
- id: business-skill
  name: '@xagent/dsh-business-skill'
  config:
    backendOrigin: 'http://xagent.snapshot'
    serviceToken: snapshot-service-token
    maxCatalogEntries: 100
    testProvider: !!js process.env.XAGENT_BUSINESS_TEST_PROVIDER
    testModel: !!js process.env.XAGENT_BUSINESS_TEST_MODEL
