- id: backend
  name: './backend.ts'

- id: agent
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    agents: []
    workspaceContext: false
    skills:
      enabled: false
    toolBash: false
    toolJobs: false
    goals: false

- id: llm
  name: './mock-llm.ts'

- id: persistence
  name: '@xagent/dsh-session-persistence-api'
  config:
    backendOrigin: 'http://xagent.snapshot'
    serviceToken: snapshot-service-token

- id: retrieval
  name: '@xagent/dsh-retrieval'
  config:
    backendOrigin: 'http://xagent.snapshot'
    serviceToken: snapshot-service-token
    delegationPrivateKey: !!js process.env.XAGENT_SNAPSHOT_PRIVATE_KEY
    delegationIssuer: xagent-host
    delegationAudience: xagent-api

- id: tool-retrieval
  name: '@xagent/dsh-tool-retrieval'

- id: fact
  name: '@xagent/dsh-fact'
  config:
    backendOrigin: 'http://xagent.snapshot'
    serviceToken: snapshot-service-token
    delegationPrivateKey: !!js process.env.XAGENT_SNAPSHOT_PRIVATE_KEY
    delegationIssuer: xagent-host
    delegationAudience: xagent-api

- id: tool-fact
  name: '@xagent/dsh-tool-fact'
