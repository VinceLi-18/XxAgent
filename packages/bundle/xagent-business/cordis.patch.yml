# XAgent 业务层在 dsh-base 之后应用。每个同 id 行整体替换基础行，
# 因此拒绝决定不依赖底层行的部分合并或启动平台。
- id: settings
  config:
    dshHome: !!js dshProfileDataPath()
- id: credentials
  config:
    dshHome: !!js dshProfileDataPath()
- id: session-persistence-jsonl
  disabled: true
- id: attachment-local
  config:
    dshHome: !!js dshProfileDataPath()
- id: storage-json
  config:
    root: !!js dshProfileDataPath('storages')
- id: bash-sandbox
  disabled: true
- id: pwsh-sandbox
  disabled: true
- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: true
- id: tool-fs
  disabled: true
- id: tool-fs-search
  disabled: true
- id: tool-str-replace-editor
  disabled: true
- id: tool-web
  disabled: true
- id: fs-observation-policy
  disabled: true
- id: fs-sandbox
  disabled: true
- id: subagent
  disabled: true
- id: subagent-spawn-in-process
  disabled: true
- id: subagent-fork-in-process
  disabled: true
- id: tool-subagent
  disabled: true
- id: tool-subagent-control
  disabled: true
- id: tool-subagent-list-agents
  disabled: true
- id: tool-subagent-fork
  disabled: true
- id: tool-subagent-report
  disabled: true
- id: workflow-worker-thread
  disabled: true
- id: tool-workflow
  disabled: true
- id: tool-skill
  disabled: true
- id: skill-filesystem
  disabled: true
- id: permission
  disabled: true
- id: ui-permission
  disabled: true
- id: agent-presets
  disabled: true
- id: ui-agent-preset
  disabled: true
- id: workspace
  disabled: true
- id: ui-workspace
  disabled: true

- insert:
    - id: xagent-session-persistence-api
      name: '@xagent/dsh-session-persistence-api'
      config:
        backendOrigin: !!js process.env.XAGENT_API_ORIGIN
        serviceToken: !!js process.env.XAGENT_SERVICE_TOKEN

    - id: xagent-connection-auth
      name: '@xagent/dsh-connection-auth'
      config:
        backendOrigin: !!js process.env.XAGENT_API_ORIGIN
        serviceToken: !!js process.env.XAGENT_SERVICE_TOKEN
        allowedOrigins: !!js process.env.XAGENT_ALLOWED_ORIGINS?.split(',').map(value => value.trim()).filter(Boolean)
        secureCookie: !!js process.env.XAGENT_ALLOW_INSECURE_COOKIE !== '1'

    - id: xagent-authorization
      name: '@xagent/dsh-authorization'
      config:
        backendOrigin: !!js process.env.XAGENT_API_ORIGIN
        serviceToken: !!js process.env.XAGENT_SERVICE_TOKEN
