[project]
name = "xagent-embedding"
version = "0.1.0"
description = "Internal CPU embedding service for XAgent retrieval"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "sentence-transformers>=3.0,<4.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.0,<9.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
