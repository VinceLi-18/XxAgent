services:
  api:
    build:
      context: .
    image: xagent-api:local
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_ADMIN_URL: ${DATABASE_ADMIN_URL}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET_KEY: "${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env to a high-entropy value}"
      JWT_ISSUER: "${JWT_ISSUER:?Set JWT_ISSUER in .env}"
      JWT_AUDIENCE: "${JWT_AUDIENCE:?Set JWT_AUDIENCE in .env}"
      XAGENT_SERVICE_TOKEN: "${XAGENT_SERVICE_TOKEN:?Set XAGENT_SERVICE_TOKEN in .env to a high-entropy value}"
      XAGENT_DELEGATION_PUBLIC_KEY: "${XAGENT_DELEGATION_PUBLIC_KEY:?Set XAGENT_DELEGATION_PUBLIC_KEY in .env}"
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_SECURE: ${MINIO_SECURE}
      MINIO_PUBLIC_SECURE: ${MINIO_PUBLIC_SECURE}
      MINIO_BUCKET: ${MINIO_BUCKET:-xagent-private}
      MAX_ARTIFACT_SIZE_BYTES: ${MAX_ARTIFACT_SIZE_BYTES}
      STAGING_EXPIRY_DAYS: ${STAGING_EXPIRY_DAYS}
      CLAMAV_TIMEOUT: ${CLAMAV_TIMEOUT}
      EMBEDDING_URL: http://embedding:8000
      EMBEDDING_TIMEOUT: ${EMBEDDING_TIMEOUT:-120}
      HF_HOME: /tmp/xagent-huggingface
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-false}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ${XAGENT_EMBEDDING_CACHE_DIR:-./.cache/huggingface}:/tmp/xagent-huggingface:ro
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
      embedding:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; assert urlopen('http://127.0.0.1:8000/api/v1/health').read() == b'{\"status\":\"ok\"}'",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  worker:
    image: xagent-api:local
    environment:
      DATABASE_WORKER_URL: ${DATABASE_WORKER_URL}
      POSTGRES_WORKER_PASSWORD: ${POSTGRES_WORKER_PASSWORD}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_SECURE: ${MINIO_SECURE}
      MINIO_BUCKET: ${MINIO_BUCKET:-xagent-private}
      MINIO_TIMEOUT: ${MINIO_TIMEOUT:-10}
      CLAMAV_HOST: ${CLAMAV_HOST:-clamav}
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
      CLAMAV_TIMEOUT: ${CLAMAV_TIMEOUT}
      EMBEDDING_URL: http://embedding:8000
      EMBEDDING_TIMEOUT: ${EMBEDDING_TIMEOUT:-120}
      HF_HOME: /tmp/xagent-huggingface
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-false}
    command: ["xagent-api", "worker"]
    stop_grace_period: 2m
    volumes:
      - ${XAGENT_EMBEDDING_CACHE_DIR:-./.cache/huggingface}:/tmp/xagent-huggingface:ro
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
      clamav:
        condition: service_healthy
      embedding:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - xagent-api-postgres:/var/lib/postgresql/data

  roles:
    image: xagent-api:local
    environment:
      DATABASE_ADMIN_URL: ${DATABASE_ADMIN_URL}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD}
      POSTGRES_WORKER_USER: ${POSTGRES_WORKER_USER}
      POSTGRES_WORKER_PASSWORD: ${POSTGRES_WORKER_PASSWORD}
    command: ["xagent-api", "roles", "ensure"]
    depends_on:
      postgres:
        condition: service_healthy

  migrate:
    image: xagent-api:local
    environment:
      DATABASE_ADMIN_URL: ${DATABASE_ADMIN_URL}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER}
      POSTGRES_WORKER_USER: ${POSTGRES_WORKER_USER}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      roles:
        condition: service_completed_successfully

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:5173
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - xagent-api-minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  clamav:
    image: clamav/clamav-debian:1.4
    volumes:
      - xagent-api-clamav:/var/lib/clamav

  embedding:
    build:
      context: ../embedding
    image: xagent-embedding:local
    environment:
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-false}
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      TOKENIZERS_PARALLELISM: "false"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json; from urllib.request import Request, urlopen; request = Request('http://127.0.0.1:8000/embed', data=b'{\"texts\":[\"health\"]}', headers={'Content-Type':'application/json'}); body = json.load(urlopen(request, timeout=110)); assert body['model'] == 'BAAI/bge-m3'; assert body['revision'] == '5617a9f61b028005a4858fdac845db406aefb181'; assert body['dimension'] == 1024; assert len(body['vectors']) == 1; assert len(body['vectors'][0]) == 1024",
        ]
      interval: 10s
      timeout: 120s
      retries: 12
      start_period: 10m
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 6G
    volumes:
      - ${XAGENT_EMBEDDING_CACHE_DIR:-./.cache/huggingface}:/tmp/xagent-huggingface

volumes:
  xagent-api-clamav:
  xagent-api-minio:
  xagent-api-postgres:
