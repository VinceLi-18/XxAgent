[project]
name = "xagent-api"
version = "0.1.0"
description = "XAgent API"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13,<2.0",
    "argon2-cffi>=25.1,<26.0",
    "asyncpg>=0.29,<1.0",
    "fastapi>=0.115,<1.0",
    "httpx>=0.27,<1.0",
    "clamd>=1.0,<2.0",
    "minio>=7.2,<8.0",
    "pydantic-settings>=2.6,<3.0",
    "pgvector>=0.4,<1.0",
    "python-magic>=0.4.27,<1.0",
    "PyJWT>=2.8,<3.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "uvicorn[standard]>=0.30,<1.0",
    "urllib3>=2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
]

[project.scripts]
xagent-api = "app.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
