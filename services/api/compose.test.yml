name: xagent-api-test

services:
  api:
    build:
      context: .
    image: xagent-api:test
    environment:
      DATABASE_URL: postgresql+asyncpg://xagent_e2e_app@postgres:5432/xagent_api_test
      DATABASE_ADMIN_URL: postgresql+asyncpg://postgres@postgres:5432/xagent_api_test
      POSTGRES_APP_USER: xagent_e2e_app
      POSTGRES_APP_PASSWORD: p@ss:word/%-e2e-app
      POSTGRES_PASSWORD: xagent-api-test
      JWT_SECRET_KEY: xagent-e2e-signing-key-test-only
      JWT_ISSUER: xagent-e2e
      JWT_AUDIENCE: xagent-e2e-api
      XAGENT_SERVICE_TOKEN: xagent-e2e-service-token-test-only-0001
      XAGENT_DELEGATION_PUBLIC_KEY: A6EHv/POEL4dcN0Y50vAmWfk1jCbpQ1fHdyGZBJVMbg=
      MINIO_ENDPOINT: minio:9000
      MINIO_PUBLIC_ENDPOINT: 127.0.0.1:59000
      MINIO_REGION: us-east-1
      MINIO_ACCESS_KEY: xagent-e2e-minio
      MINIO_SECRET_KEY: xagent-e2e-minio-secret
      MINIO_SECURE: "false"
      MINIO_PUBLIC_SECURE: "false"
      MINIO_BUCKET: xagent-private
      MAX_ARTIFACT_SIZE_BYTES: "52428800"
      STAGING_EXPIRY_DAYS: "1"
      CLAMAV_TIMEOUT: "10"
      EMBEDDING_URL: http://embedding:8000
      EMBEDDING_TIMEOUT: "120"
      HF_HOME: /tmp/xagent-huggingface
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-false}
    ports:
      - "127.0.0.1:58000:8000"
    volumes:
      - ${XAGENT_EMBEDDING_CACHE_DIR:-./.cache/huggingface}:/tmp/xagent-huggingface:ro
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
      embedding:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; assert urlopen('http://127.0.0.1:8000/api/v1/health').read() == b'{\"status\":\"ok\"}'",
        ]
      interval: 2s
      timeout: 5s
      retries: 30

  worker:
    image: xagent-api:test
    environment:
      DATABASE_WORKER_URL: postgresql+asyncpg://xagent_e2e_worker@postgres:5432/xagent_api_test
      POSTGRES_WORKER_PASSWORD: p@ss:word/%-e2e-worker
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: xagent-e2e-minio
      MINIO_SECRET_KEY: xagent-e2e-minio-secret
      MINIO_SECURE: "false"
      MINIO_BUCKET: xagent-private
      MINIO_TIMEOUT: "10"
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
      CLAMAV_TIMEOUT: "10"
      EMBEDDING_URL: http://embedding:8000
      EMBEDDING_TIMEOUT: "120"
      HF_HOME: /tmp/xagent-huggingface
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-false}
    command:
      [
        "xagent-api",
        "worker",
        "--lease-seconds",
        "8",
        "--heartbeat-seconds",
        "2",
        "--poll-seconds",
        "0.2",
      ]
    stop_grace_period: 2m
    volumes:
      - ${XAGENT_EMBEDDING_CACHE_DIR:-./.cache/huggingface}:/tmp/xagent-huggingface:ro
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
      clamav:
        condition: service_healthy
      embedding:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    environment:
      POSTGRES_DB: xagent_api_test
      POSTGRES_PASSWORD: xagent-api-test
      POSTGRES_USER: postgres
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 2s
      timeout: 5s
      retries: 20
    volumes:
      - xagent-api-test-postgres:/var/lib/postgresql/data

  roles:
    image: xagent-api:test
    environment:
      DATABASE_ADMIN_URL: postgresql+asyncpg://postgres@postgres:5432/xagent_api_test
      POSTGRES_PASSWORD: xagent-api-test
      POSTGRES_APP_USER: xagent_e2e_app
      POSTGRES_APP_PASSWORD: p@ss:word/%-e2e-app
      POSTGRES_WORKER_USER: xagent_e2e_worker
      POSTGRES_WORKER_PASSWORD: p@ss:word/%-e2e-worker
    command: ["xagent-api", "roles", "ensure"]
    depends_on:
      postgres:
        condition: service_healthy

  migrate:
    image: xagent-api:test
    environment:
      DATABASE_ADMIN_URL: postgresql+asyncpg://postgres@postgres:5432/xagent_api_test
      POSTGRES_PASSWORD: xagent-api-test
      POSTGRES_APP_USER: xagent_e2e_app
      POSTGRES_WORKER_USER: xagent_e2e_worker
    command: ["alembic", "upgrade", "head"]
    depends_on:
      roles:
        condition: service_completed_successfully

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: xagent-e2e-minio
      MINIO_ROOT_PASSWORD: xagent-e2e-minio-secret
    ports:
      - "127.0.0.1:59000:9000"
    volumes:
      - xagent-api-test-minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 5s
      retries: 30

  clamav:
    image: clamav/clamav-debian:1.4
    volumes:
      - xagent-api-test-clamav:/var/lib/clamav

  embedding:
    build:
      context: ../embedding
    image: xagent-embedding:test
    environment:
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-false}
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      TOKENIZERS_PARALLELISM: "false"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json; from urllib.request import Request, urlopen; request = Request('http://127.0.0.1:8000/embed', data=b'{\"texts\":[\"health\"]}', headers={'Content-Type':'application/json'}); body = json.load(urlopen(request, timeout=110)); assert body['model'] == 'BAAI/bge-m3'; assert body['revision'] == '5617a9f61b028005a4858fdac845db406aefb181'; assert body['dimension'] == 1024; assert len(body['vectors']) == 1; assert len(body['vectors'][0]) == 1024",
        ]
      interval: 10s
      timeout: 120s
      retries: 12
      start_period: 10m
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 6G
    volumes:
      - ${XAGENT_EMBEDDING_CACHE_DIR:-./.cache/huggingface}:/tmp/xagent-huggingface

volumes:
  xagent-api-test-clamav:
  xagent-api-test-minio:
  xagent-api-test-postgres:
